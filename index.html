<style>

.btn.y{background:var(--y);color:#1b2a41;box-shadow:0 3px 0 #c99a0a}.btn.g{background:var(--g);box-shadow:0 3px 0 #146b3b}.btn.o{background:var(--s);color:var(--t);box-shadow:none}

.stat{text-align:center}.stat b{display:block;font-size:1.7rem;color:var(--b)}
.login{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;min-height:80vh}@media(max-width:700px){.login{grid-template-columns:1fr;min-height:0}}

.er{color:var(--r);font-weight:800;min-height:1.5em}small{opacity:.85}
table{border-collapse:collapse;width:100%;text-align:center}td,th{border:2px solid var(--s);padding:6px}

:root{--g1:#f5fbff;--g2:#c2e5ff;--g3:#8fd1ff}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#0b1830;--g2:#15335f;--g3:#1f4f96}}:root[data-theme="dark"]{--g1:#0b1830;--g2:#15335f;--g3:#1f4f96}

@page{size:A4 landscape;margin:0}

const T=[
{n:'Bilangan',e:'🔢',c:'#1e6fd9',r:'Pulau Bilangan',d:'Bilangan cacah sampai 10.000: nilai tempat, urutan, dan pola.',
m:[['Mengenal bilangan sampai 10.000','Bilangan cacah dimulai dari 0. Setelah 9.999 datang <b>10.000</b> (sepuluh ribu). Pada garis bilangan, makin ke kanan makin besar.<br>4.725 dibaca “empat ribu tujuh ratus dua puluh lima”.<br><small>🧠 Tahukah kamu? Tanda titik pada 4.725 memudahkan kita membaca ribuan.</small>'],
['Nilai tempat dan nilai angka','<table><tr><th>Ribuan</th><th>Ratusan</th><th>Puluhan</th><th>Satuan</th></tr><tr><td>4</td><td>7</td><td>2</td><td>5</td></tr><tr><td>4.000</td><td>700</td><td>20</td><td>5</td></tr></table>Pada 4.725, <b>nilai tempat</b> angka 7 adalah ratusan, <b>nilai angkanya</b> 700.<br>Uraian: 4.725 = 4.000 + 700 + 20 + 5.'],
['Membandingkan dan mengurutkan','Bandingkan dari angka paling kiri. 3.250 dan 3.205: ribuan dan ratusan sama, puluhan 5 &gt; 0, jadi <b>3.250 &gt; 3.205</b>.<br>Tanda: &gt; lebih besar, &lt; lebih kecil, = sama. Mengurutkan: cari yang terkecil dulu, lalu naik.'],
['Pola bilangan','100, 200, 300, 400, 500 … bertambah 100 tiap langkah.<br>Cari selisih dua bilangan berdekatan, lalu lanjutkan.<br><b>Rangkuman:</b> nilai tempat menentukan nilai angka; bandingkan dari kiri; pola punya aturan tetap.']],
p:[['Nilai angka 4 pada 4.725 adalah…','4.000','400','40','4','Perhatikan: angka 4 berada di ribuan.','Angka 4 ada di nilai tempat ribuan, jadi nilainya 4.000.'],
['Pernyataan mana yang benar?','3.250 &gt; 3.205','3.250 &lt; 3.205','3.250 = 3.205','3.205 &gt; 3.250','Bandingkan puluhannya: 5 dan 0.','Ribuan dan ratusan sama; puluhan 5 lebih besar dari 0.'],

{n:'Aljabar',e:'➕',c:'#22a05b',r:'Lembah Aljabar',d:'Mencari nilai yang belum diketahui dalam kalimat matematika.',
m:[['Nilai yang belum diketahui','Kotak <b>□</b> mewakili bilangan yang belum kita tahu.<br>🍎 □ + 3 = 10 → ada □ apel ditambah 3 apel jadi 10 apel. □ = 7.<br><small>🧠 Tahukah kamu? Huruf seperti n dan x juga dipakai untuk hal yang sama.</small>'],
['Penjumlahan dan pengurangan saling berkaitan','□ + 8 = 20 → 20 − 8 = 12.<br>Cek: 12 + 8 = 20 ✔️<br>Pengurangan membantu mencari □ pada penjumlahan, dan sebaliknya.'],
['Ayo Berpikir: 5 langkah','1) Apa yang diketahui? 2) Apa yang dicari? 3) Tulis kalimat matematika. 4) Hitung jawabannya. 5) Pilih alasan: mengapa memakai penjumlahan atau pengurangan?'],
['Pada pengukuran','Pita 50 cm dipotong, sisa 30 cm. 50 − □ = 30, maka □ = 20 cm.<br><b>Rangkuman:</b> gunakan operasi kebalikan, lalu cek jawabanmu.']],
p:[['🍎 □ + 6 = 15. Berapa □?','9','21','10','8','Pakai pengurangan: 15 − 6.','15 − 6 = 9. Cek: 9 + 6 = 15.'],
['□ − 12 = 30. Berapa □?','42','18','32','52','Kebalikan pengurangan adalah penjumlahan.','30 + 12 = 42. Cek: 42 − 12 = 30.'],
['Kelereng Dina 25. Setelah diberi Rani, jumlahnya 40. Berapa kelereng dari Rani?','15','65','25','10','Kalimat matematikanya 25 + □ = 40.','40 − 25 = 15 kelereng.']]},
{n:'Pengukuran',e:'📏',c:'#e08a00',r:'Pegunungan Pengukuran',d:'Panjang dan berat dengan satuan baku.',
m:[['Satuan panjang',`1 cm = 10 mm · 1 m = 100 cm · 1 km = 1.000 m.<br>Contoh: tebal buku dalam mm, panjang pensil dalam cm, jarak ke sekolah dalam km.<div>${ruler(4)}</div>Pensil di atas panjangnya <b>4 cm</b>.`],
['Alat ukur panjang','Penggaris untuk benda kecil (pensil, buku). Meteran jahit untuk kain. Meteran gulung untuk ruangan atau lapangan.<br>Pilih alat sesuai ukuran benda.'],
['Satuan dan alat ukur berat','1 kg = 1.000 g.<br>Timbangan dapur untuk bahan kue, timbangan badan untuk tubuh, timbangan barang untuk karung atau paket.'],
['Membandingkan dan memperkirakan','Ubah ke satuan yang sama sebelum membandingkan: 2 kg = 2.000 g.<br>Perkiraan harus masuk akal: pensil baru ± 18 cm, apel ± 150 g.<br><b>Rangkuman:</b> pilih satuan dan alat yang tepat.']],
p:[['Pensil pada penggaris berukuran…','7 cm','6 cm','8 cm','70 cm','Lihat ujung pensil pada angka penggaris.','Ujung pensil tepat di angka 7, jadi 7 cm.'],
['3 kg = … g','3.000','300','30','30.000','1 kg = 1.000 g.','3 × 1.000 = 3.000 g.'],
['Alat terbaik untuk mengukur panjang lapangan?','Meteran gulung','Penggaris 30 cm','Timbangan dapur','Gelas takar','Pilih alat yang bisa menjangkau jarak jauh.','Lapangan itu panjang, jadi memakai meteran gulung.']]},
{n:'Geometri',e:'🔷',c:'#8a4fd6',r:'Kota Geometri',d:'Ciri-ciri bangun datar dan segibanyak.',

['Sisi, sudut, dan titik sudut','<b>Sisi</b> adalah garis pembatas bangun. <b>Titik sudut</b> adalah tempat dua sisi bertemu. <b>Sudut</b> adalah celah antara dua sisi.<br>Segitiga: 3 sisi, 3 titik sudut. Segiempat: 4 sisi, 4 titik sudut.'],
['Ciri segiempat','Persegi: 4 sisi sama, 4 sudut siku-siku. Persegi panjang: sisi berhadapan sama, 4 sudut siku-siku. Jajargenjang: sisi berhadapan sejajar. Trapesium: satu pasang sisi sejajar. Layang-layang: dua pasang sisi berdekatan sama. <b>Belah ketupat</b>: 4 sisi sama panjang, tetapi sudutnya tidak harus siku-siku.'],
['Segitiga dan segibanyak','Segitiga sama sisi (3 sisi sama), sama kaki (2 sisi sama), sembarang (tidak ada yang sama). Segilima punya 5 sisi, segienam 6 sisi.<br>Benda nyata berbentuk 3D; yang kita cari adalah bentuk datar pada permukaannya.']],
p:[['Empat sisi sama panjang tetapi sudutnya tidak semua siku-siku. Bangun apa?','Belah ketupat','Persegi','Persegi panjang','Segitiga','Ingat: sisi sama panjang belum tentu bersudut siku-siku.','Belah ketupat bersisi sama panjang, sudutnya tidak harus siku-siku.'],
['Segienam memiliki … titik sudut.','6','5','4','8','Jumlah titik sudut sama dengan jumlah sisi.','Segienam punya 6 sisi dan 6 titik sudut.'],
['Segitiga dengan dua sisi sama panjang disebut…','Sama kaki','Sama sisi','Sembarang','Persegi','Hanya dua sisi yang sama.','Dua sisi sama panjang = segitiga sama kaki.']]}];

['Nilai angka 7 pada 4.725 adalah…','700','7','70','7.000',0,'Angka 7 di tempat ratusan, nilainya 700.'],
['Tiga ribu dua ratus lima puluh ditulis…','3.250','3.205','3.520','3.025',0,'3.000 + 200 + 50 = 3.250.'],
['Perpustakaan A punya 3.250 buku, B punya 3.205 buku. Tanpa menghitung selisih, bagaimana tahu yang lebih banyak?','Bandingkan angka dari nilai tempat terbesar sampai ada yang berbeda','Hitung banyak angkanya saja','Pilih yang berakhiran 0','Jumlahkan semua angkanya',0,'Ribuan dan ratusan sama; puluhan 5 &gt; 0, jadi A lebih banyak.'],
['Bilangan terkecil adalah…','4.050','5.040','4.500','5.004',0,'Ribuan terkecil 4, lalu ratusan terkecil 0: 4.050.'],
['Lanjutkan pola: 1.000, 2.000, 3.000, …','4.000','3.500','5.000','4.500',0,'Bertambah 1.000 tiap langkah.'],
['□ + 8 = 20. Nilai □ adalah…','12','28','10','13',1,'20 − 8 = 12.'],
['35 − □ = 20. Nilai □ adalah…','15','55','25','10',1,'35 − 20 = 15.'],
['Andi punya kelereng, diberi 15, jadi 40. Kelereng Andi mula-mula…','25','55','35','15',1,'40 − 15 = 25.'],
['Untuk mencari □ pada □ + 17 = 45, kita hitung…','45 − 17','45 + 17','17 − 45','45 × 17',1,'Operasi kebalikan penjumlahan adalah pengurangan.'],
['Pita 50 cm dipotong □ cm, sisanya 30 cm. Nilai □ adalah…','20','80','30','25',1,'50 − 30 = 20.'],

['Banyak sisi segienam…','6','5','7','8',3,'Segienam punya 6 sisi.'],

function kid(){return `<svg viewBox="0 0 320 280" role="img" aria-label="Siswa ceria belajar matematika"><ellipse cx="160" cy="264" rx="120" ry="10" fill="#cfe3ff"/><g fill="#fff" stroke="#cfe3ff"><ellipse cx="60" cy="40" rx="34" ry="14"/><ellipse cx="262" cy="56" rx="30" ry="12"/></g><path d="M250 100l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#ffc933"/><rect x="95" y="150" width="130" height="100" rx="28" fill="#1e6fd9"/><circle cx="160" cy="105" r="52" fill="#ffd8b5"/><path d="M108 104q2-58 52-58t52 58q-30-26-52-24t-52 24z" fill="#3b2a20"/><circle cx="140" cy="110" r="6" fill="#1b2a41"/><circle cx="180" cy="110" r="6" fill="#1b2a41"/><circle cx="128" cy="124" r="7" fill="#ff9aa2" opacity=".6"/><circle cx="192" cy="124" r="7" fill="#ff9aa2" opacity=".6"/><path d="M142 128q18 18 36 0" stroke="#1b2a41" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="108" y="198" width="104" height="58" rx="8" fill="#ffc933"/><text x="160" y="236" text-anchor="middle" font-size="26" font-weight="800" fill="#134a9c">1+2=3</text><text x="28" y="150" font-size="40">🔢</text><text x="256" y="190" font-size="40">📏</text><text x="26" y="230" font-size="34">🔷</text><text x="262" y="250" font-size="30">✏️</text><text x="40" y="90" font-size="26">⭐</text></svg>`}
function go(v,a){V=v;A=a||{};render();scrollTo(0,0)}
function render(){const h=$('#hd');h.hidden=!U;if(U)h.innerHTML=`<b>🧮 Petualangan Matematika IV</b>${[['dash','🏠 Dashboard'],['peta','🗺️ Peta'],['quiz','📝 Kuis'],['pet','❓ Petunjuk'],['ttg','ℹ️ Tentang']].map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="logout()">🔁 Ganti Siswa</button>`;app.innerHTML=(U||V=='login'?VW[V]:VW.login)()}
function login(){const n=$('#nm').value.trim(),k=$('#kl').value;if(!n){$('#er').textContent='Nama belum diisi, yuk tulis namamu!';$('#nm').focus();return false}if(!k){$('#er').textContent='Kelas belum dipilih, yuk pilih kelasmu!';$('#kl').focus();return false}U={n,k};sv(K,U);P=ld(pk())||{xp:0,done:{},badge:{},q:null};save();go('dash');return false}
function cfm(m,f){const d=document.createElement('div');d.className='mo';d.innerHTML=`<div class="card" role="dialog" aria-modal="true"><p><b>${m}</b></p><button class="btn g" id="cy">Ya</button><button class="btn o" id="cn">Batal</button></div>`;document.body.appendChild(d);$('#cy').onclick=()=>{d.remove();f()};$('#cn').onclick=()=>d.remove();$('#cy').focus()}
function logout(){cfm('Ganti siswa? Kamu akan kembali ke halaman login. Progres tiap siswa tetap tersimpan.',()=>{try{localStorage.removeItem(K)}catch(e){}U=null;P=null;go('login')})}
function reg(t,peta){const d=T[t],n=tp(t);return `<div class="card" style="border-top:8px solid ${d.c}"><h3>${d.e} ${peta?d.r:d.n}</h3><p>${d.d}</p><div class="bar" aria-label="progres"><i style="width:${n*25}%"></i></div><small>${n}/4 misi selesai ${P.badge[t]?'· 🏅 Lencana diraih':n==4?'':''}</small><br><button class="btn" onclick="go('mat',{t:${t},i:0})">${peta?(n?'Lanjutkan':'Mulai'):'Pelajari'}</button>${n>0?`<button class="btn o" onclick="go('act',{t:${t},i:0})">Latihan</button>`:''}</div>`}
const VW={
login(){return `<section class="login"><div>${kid()}</div><div class="card"><h1>Selamat Datang, Petualang Matematika!</h1><p>Yuk, kenalan dulu sebelum memulai petualangan belajar matematika!</p><form onsubmit="return login()" novalidate><label for="nm"><b>Nama lengkap</b></label><input id="nm" autocomplete="off" maxlength="40" placeholder="Tulis namamu"><label for="kl"><b>Kelas</b></label><select id="kl"><option value="">Pilih kelasmu</option>${['IV-A','IV-B','IV-C','IV-D','IV Lainnya'].map(x=>`<option>${x}</option>`).join('')}</select><div class="er" id="er" role="alert"></div><button class="btn y" style="font-size:1.2rem">Mulai Belajar 🚀</button></form></div></section>`},
dash(){const q=P.q&&P.q.fin?P.q:null,n=Object.keys(P.done).length,done=Object.keys(P.badge).length;return `<div class="card"><div style="display:flex;gap:14px;align-items:center"><span style="font-size:3.4rem">🦉</span><div><h1>Halo, ${esc(U.n)}! 👋</h1><b>Kelas ${esc(U.k)}</b> · Level: ${LV[lvl()]}<br>Setiap langkah kecil membuatmu makin pintar. Ayo lanjutkan! 💪</div></div></div><div class="stats"><div class="card stat"><b>${P.xp}</b>Total XP</div><div class="card stat"><b>${Math.floor(P.xp/10)} ⭐</b>Bintang</div><div class="card stat"><b>${done}/4</b>Misi selesai</div><div class="card stat"><b>${done} 🏅</b>Lencana</div><div class="card stat"><b>${q?q.sc:'-'}</b>Kuis terakhir</div></div><div class="card"><b>Progres belajar: ${n}/16</b><div class="bar"><i style="width:${n/16*100}%"></i></div></div><h2>Pilih Materi</h2><div class="grid">${[0,1,2,3].map(t=>reg(t)).join('')}</div>`},
peta(){return `<h1>🗺️ Peta Petualangan</h1><p>Jelajahi keempat wilayah. Semua wilayah terbuka, jadi kamu bebas memilih.</p><div class="grid">${[0,1,2,3].map(t=>reg(t,1)).join('')}</div><div class="card">${Object.keys(P.badge).length==4?'🏆 Kamu Juara Petualangan Matematika!':'Selesaikan semua wilayah untuk meraih gelar Juara Petualangan Matematika.'}</div>`},
mat(){const t=A.t,i=A.i,d=T[t],c=d.m[i],last=i==3;return `<div class="card"><small>${d.e} ${d.n} · Kartu ${i+1}/4</small><h2>${c[0]}</h2><div>${c[1]}</div></div><button class="btn o" ${i?'':'disabled'} onclick="go('mat',{t:${t},i:${i-1}})">◀ Sebelumnya</button>${last?`<button class="btn g" onclick="award('m${t}',10);go('act',{t:${t},i:0})">Selesai, Ayo Latihan! ▶</button>`:`<button class="btn" onclick="go('mat',{t:${t},i:${i+1}})">Berikutnya ▶</button>`}<button class="btn o" onclick="go('dash')">Dashboard</button>`},
act(){const t=A.t,i=A.i,r=T[t].p[i],pos=(i+t)%4,o=mk(r,1,pos),w=A.w||[];return `<div class="card"><small>${T[t].e} Latihan ${T[t].n} · ${i+1}/3</small><h2>${r[0]}</h2>${t==2&&i==0?ruler(7):''}${o.map((x,j)=>`<button class="opt ${A.ok&&j==pos?'good':w.includes(j)?'bad':''}" ${A.ok||w.includes(j)?'disabled':''} onclick="ans(${j})">${x}</button>`).join('')}${A.m?`<div class="fb ${A.ok?'ok':'no'}" role="status">${A.m}</div>`:''}</div>${A.ok?`<button class="btn g" onclick="${i<2?`go('act',{t:${t},i:${i+1}})`:`go('peta')`}">${i<2?'Lanjut ▶':'Selesai, ke Peta 🗺️'}</button>`:''}<button class="btn o" onclick="go('mat',{t:${t},i:0})">Baca Materi</button>`},
quiz(){const q=P.q;if(!q)return `<div class="card"><h1>📝 Kuis Akhir</h1><p>20 soal pilihan ganda: Bilangan, Aljabar, Pengukuran, dan Geometri. Pilih satu jawaban lalu tekan Berikutnya. Setelah ditekan, jawaban terkunci. Nilai muncul setelah kuis selesai.</p><button class="btn y" onclick="startQ()">Mulai Kuis</button></div>`;
if(q.fin)return `<div class="card"><h2>Kuis sudah selesai</h2><button class="btn" onclick="go('hasil')">Lihat Hasil</button><button class="btn o" onclick="redo()">Ulangi Kuis</button></div>`;
const i=q.c,r=QZ[i],o=mk(r,1,qp(i)),lk=q.l[i];return `<div class="card"><small>Soal ${i+1} dari 20</small><div class="bar"><i style="width:${(i+1)*5}%"></i></div><h2>${r[0]}</h2>${o.map((x,j)=>`<button class="opt ${q.a[i]===j?'sel':''}" ${lk?'disabled':''} onclick="pick(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}${lk?'<small>🔒 Jawaban sudah terkunci. Kamu hanya melihat.</small>':''}</div><button class="btn o" ${i?'':'disabled'} onclick="P.q.c--;render()">◀ Sebelumnya</button>${i<19?`<button class="btn" onclick="nextQ()">Berikutnya ▶</button>`:`<button class="btn g" onclick="finQ()">Selesai ✔️</button>`}`},
hasil(){const q=P.q;if(!q||!q.fin)return `<div class="card">Selesaikan kuis dulu, ya.<br><button class="btn" onclick="go('quiz')">Ke Kuis</button></div>`;const ok=q.sc>=71,rec=q.per.map((b,t)=>b<4?t:-1).filter(t=>t>=0);return `<div class="card"><h1>Hasil Belajar</h1><b>${esc(U.n)}</b> · Kelas ${esc(U.k)} · ${fmt(q.date)}<div class="stat"><b style="font-size:3.5rem">${q.sc}</b>${cat(q.sc)}</div><p>Benar: ${q.b} · Salah: ${20-q.b} · Persentase: ${q.sc}% · Sertifikat: ${ok?'✅ berhak':'belum memenuhi syarat (minimal 71)'}</p>${q.per.map((b,t)=>`<div>${T[t].e} ${T[t].n}: ${b}/5<div class="bar"><i style="width:${b*20}%"></i></div></div>`).join('')}<h3>Rekomendasi</h3><p>${rec.length?'Yuk ulangi: '+rec.map(t=>T[t].n).join(', ')+'.':'Semua materi sudah kamu kuasai dengan baik!'}</p>${ok?'':`<div class="fb no">Jangan menyerah! 🌱 Kamu sudah berani mencoba. Yuk, pelajari kembali materi yang belum kamu kuasai, kerjakan latihan, dan coba kuis sekali lagi. Kamu pasti bisa berkembang!</div>`}${ok?`<button class="btn y" onclick="go('cert')">🏅 Lihat Sertifikat</button>`:`<button class="btn" onclick="go('mat',{t:${rec[0]||0},i:0})">Pelajari Materi Lagi</button>`}<button class="btn o" onclick="go('review')">Lihat Pembahasan</button><button class="btn o" onclick="redo()">Ulangi Kuis</button><button class="btn o" onclick="go('dash')">Dashboard</button></div>`},
review(){const q=P.q;if(!q||!q.fin)return VW.hasil();return `<h1>Pembahasan Kuis</h1>${QZ.map((r,i)=>{const o=mk(r,1,qp(i)),ok=q.a[i]===qp(i);return `<div class="card"><small>Soal ${i+1} · ${T[r[5]].n}</small><p><b>${r[0]}</b></p><p>Jawabanmu: ${o[q.a[i]]} ${ok?'✅':'❌'}<br>Jawaban benar: ${r[1]}</p><p>💡 ${r[6]}</p>${ok?'':`<button class="btn o" onclick="go('mat',{t:${r[5]},i:0})">Pelajari ${T[r[5]].n}</button>`}</div>`}).join('')}<button class="btn" onclick="go('hasil')">Kembali ke Hasil Belajar</button><button class="btn o" onclick="redo()">Ulangi Kuis</button><button class="btn o" onclick="go('dash')">Dashboard</button>`},
cert(){const q=P.q;if(!(q&&q.fin&&q.sc>=71))return `<div class="card"><h2>Sertifikat belum tersedia</h2><p>Sertifikat diberikan jika kuis selesai dengan nilai minimal 71.</p><button class="btn" onclick="go('quiz')">Ke Kuis</button></div>`;setTimeout(()=>{const c=$('.cert');if(c)c.style.zoom=Math.min(1,(innerWidth-32)/1123)},0);return `<div class="np"><button class="btn y" onclick="print()">🖨️ Cetak / Simpan PDF</button><button class="btn o" onclick="go('hasil')">Kembali</button></div><div class="cw"><div class="cert"><span class="o" style="left:50px;top:40px">⭐</span><span class="o" style="right:50px;top:40px">🔷</span><span class="o" style="left:50px;bottom:40px">📏</span><span class="o" style="right:50px;bottom:40px">✏️</span><div class="ct">SERTIFIKAT PENGHARGAAN</div><p><b>Petualangan Matematika Kelas IV</b></p><p>diberikan kepada</p><div class="cn">${esc(U.n)}</div><p>Kelas ${esc(U.k)}</p><p>atas keberhasilannya menyelesaikan kuis dengan nilai</p><div class="cs">${q.sc}</div><p>pada materi Bilangan, Aljabar, Pengukuran, dan Geometri<br>Selesai pada ${fmt(q.date)}</p><p><i>“Terus belajar, terus bersinar, dan jangan takut mencoba!”</i></p><p style="font-size:18px;margin-top:20px">Fatma Fauziah Azzafira · UIN Sunan Kalijaga Yogyakarta · 2026</p></div></div>`},
pet(){const s=['Isi nama dan kelas, lalu tekan Mulai Belajar.','Lihat Dashboard untuk XP, bintang, dan progres.','Buka Peta Petualangan dan pilih wilayah.','Baca kartu materi satu per satu.','Perhatikan ilustrasi dan contoh.','Tekan Selesai pada kartu terakhir untuk lanjut latihan.','Jawab soal latihan dengan menekan pilihan.','Jika salah, baca petunjuk lalu coba lagi.','Jika benar, kamu dapat XP satu kali saja.','Selesaikan semua misi wilayah untuk lencana.','Kerjakan Kuis Akhir 20 soal; jawaban terkunci setelah Berikutnya.','Lihat Hasil Belajar dan Pembahasan.','Nilai minimal 71 membuka Sertifikat yang bisa dicetak.'];return `<h1>❓ Petunjuk Penggunaan</h1><div class="grid">${s.map((x,i)=>`<div class="card"><span style="font-size:2rem">${['🧒','🏠','🗺️','📖','🔍','▶️','✏️','💡','⭐','🏅','📝','📊','🎓'][i]}</span><br><b>Langkah ${i+1}</b><br>${x}</div>`).join('')}</div>`},
ttg(){return `<h1>ℹ️ Tentang Media</h1><div class="card"><b>Petualangan Matematika Kelas IV</b><br>Materi: Bilangan, Aljabar, Pengukuran, Geometri · Sasaran: siswa Kelas IV SD/MI (Fase B)<br>Teknologi: HTML, CSS, JavaScript vanilla, localStorage</div><div class="card"><h3>Capaian Pembelajaran</h3>Peserta didik mampu memahami bilangan cacah sampai 10.000, melakukan operasi penjumlahan dan pengurangan serta menentukan nilai yang belum diketahui dalam kalimat matematika, mengukur dan membandingkan panjang serta berat menggunakan satuan baku, serta mengidentifikasi dan mendeskripsikan ciri-ciri bangun datar, seperti segitiga, segiempat, dan poligon lainnya.<h3>Tujuan Pembelajaran</h3><ol><li>Peserta didik mampu membaca, menulis, membandingkan, mengurutkan, dan melakukan operasi hitung bilangan cacah sampai 10.000.</li><li>Peserta didik mampu menentukan nilai yang belum diketahui dalam kalimat matematika yang berkaitan dengan penjumlahan dan pengurangan.</li><li>Peserta didik mampu mengukur dan membandingkan panjang serta berat benda menggunakan satuan baku.</li><li>Peserta didik mampu mengidentifikasi dan mendeskripsikan ciri-ciri bangun datar, seperti segitiga, segiempat, dan poligon lainnya.</li></ol></div><div class="card"><h3>Pengembang</h3>Nama Pengembang: Fatma Fauziah Azzafira<br>Institusi: UIN Sunan Kalijaga Yogyakarta<br>Program Studi: Pendidikan Guru Madrasah Ibtidaiyah<br>Tahun Pengembangan: 2026</div>`}};
function ans(j){const t=A.t,i=A.i,r=T[t].p[i];if(A.ok)return;if(j==(i+t)%4){A.ok=1;A.m='Hebat! Jawabanmu tepat! '+r[6];award('p'+t+i,10)}else{A.w=(A.w||[]).concat(j);A.m='Hampir benar! Coba perhatikan lagi petunjuknya. 💡 '+r[5]}render()}
function startQ(){P.q={a:Array(20).fill(null),l:Array(20).fill(0),c:0,fin:0};save();go('quiz')}
function redo(){cfm('Ulangi kuis? Hasil lama akan diganti setelah kuis baru selesai.',startQ)}
function pick(j){if(P.q.l[P.q.c])return;P.q.a[P.q.c]=j;save();render()}
function nextQ(){const q=P.q;if(q.a[q.c]===null){toast('Pilih jawabanmu dulu, ya!');return}q.l[q.c]=1;q.c++;save();render()}
function finQ(){const q=P.q;if(q.a[q.c]===null){toast('Pilih jawabanmu dulu, ya!');return}const e=q.a.indexOf(null);if(e>=0){toast('Soal nomor '+(e+1)+' belum dijawab.');q.c=e;render();return}cfm('Yakin ingin menyelesaikan kuis? Jawaban tidak bisa diubah lagi.',()=>{q.l.fill(1);q.per=[0,0,0,0];let b=0;q.a.forEach((x,i)=>{if(x===qp(i)){b++;q.per[QZ[i][5]]++}});q.b=b;q.sc=Math.round(b/20*100);q.date=new Date().toISOString();q.fin=1;save();go('hasil')})}
U=ld(K);if(U&&U.n&&U.k){P=ld(pk())||{xp:0,done:{},badge:{},q:null};go('dash')}else{U=null;go('login')}
</script></body></html>
